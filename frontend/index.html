<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>🏥 Sistema Hospitalar</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  fetch("http://localhost:3000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => {
    if (!r.ok) throw new Error("Login inválido");
    return r.json();
  })
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    else if(data.tipo === "medico") location.href = "medico.html";
    else if(data.tipo === "atendimento") location.href = "atendimento.html";
    else if(data.tipo === "almoxarifado") location.href = "almoxerifado.html";
    else alert("Perfil desconhecido!");
  })
  .catch(err => {
    alert("Usuário ou senha incorretos!");
  });
}
</script>
</body>
</html>
